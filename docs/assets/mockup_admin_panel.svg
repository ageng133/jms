<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- ================= LEFT SIDEBAR (260px) ================= -->
  <rect x="0" y="0" width="260" height="820" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Workspace Brand Header -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#4f46e5"/>
    <text x="8" y="22" fill="#ffffff" font-size="14" font-weight="800">JMS</text>
    <text x="42" y="16" fill="#0f172a" font-size="14" font-weight="700">Journal Portal</text>
    <text x="42" y="30" fill="#94a3b8" font-size="10" font-weight="500">UTS Editorial Space</text>
  </g>

  <!-- Navigation Menu -->
  <g transform="translate(16, 80)">
    <!-- 1. Overview -->
    <rect x="0" y="0" width="228" height="38" rx="8" fill="#ffffff"/>
    <text x="16" y="24" fill="#475569" font-size="13" font-weight="500">📊 Overview</text>

    <!-- 2. All Submissions -->
    <rect x="0" y="44" width="228" height="38" rx="8" fill="#ffffff"/>
    <text x="16" y="68" fill="#475569" font-size="13" font-weight="500">📄 All Submissions</text>
    <rect x="180" y="52" width="28" height="20" rx="10" fill="#f1f5f9"/>
    <text x="188" y="66" fill="#64748b" font-size="10" font-weight="700">12</text>

    <!-- 3. Submit Paper (ACTIVE) -->
    <rect x="0" y="88" width="228" height="38" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="16" y="112" fill="#4338ca" font-size="13" font-weight="700">➕ Submit Paper</text>

    <!-- 4. Journal Templates -->
    <rect x="0" y="132" width="228" height="38" rx="8" fill="#ffffff"/>
    <text x="16" y="156" fill="#475569" font-size="13" font-weight="500">📚 Journal Templates</text>
  </g>

  <!-- System Telemetry Strip in Sidebar -->
  <g transform="translate(16, 570)">
    <rect x="0" y="0" width="228" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.5">SYSTEM STATUS</text>
    
    <circle cx="20" cy="46" r="4" fill="#10b981"/>
    <text x="32" y="50" fill="#334155" font-size="12" font-weight="500">Box Cloud: Online</text>
    
    <circle cx="20" cy="70" r="4" fill="#10b981"/>
    <text x="32" y="74" fill="#334155" font-size="12" font-weight="500">Gemini AI: Active</text>
  </g>

  <!-- User Profile Card at Bottom of Sidebar -->
  <g transform="translate(16, 680)">
    <rect x="0" y="0" width="228" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- User Avatar & Info -->
    <circle cx="28" cy="32" r="16" fill="#4f46e5"/>
    <text x="23" y="37" fill="#ffffff" font-size="12" font-weight="700">A</text>
    <text x="52" y="28" fill="#0f172a" font-size="12" font-weight="700">Dr. Alexander Wright</text>
    <text x="52" y="42" fill="#64748b" font-size="10">Author (UTS Faculty of IT)</text>

    <!-- Role Switcher & Sign Out -->
    <line x1="12" y1="62" x2="216" y2="62" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="84" fill="#4f46e5" font-size="11" font-weight="600">⇄ Switch to Editor View</text>
    <text x="14" y="104" fill="#64748b" font-size="11" font-weight="500">↪ Sign Out</text>
  </g>

  <!-- ================= TOP HEADER BAR ================= -->
  <g transform="translate(260, 0)">
    <rect x="0" y="0" width="940" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="34" fill="#64748b" font-size="12">Admin Portal / <tspan fill="#0f172a" font-weight="700">Submit Paper</tspan></text>
    
    <!-- Step Badge on Header -->
    <rect x="740" y="14" width="168" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="752" y="32" fill="#4338ca" font-size="11" font-weight="700">Step 2: Dual File Upload</text>
  </g>

  <!-- ================= MAIN CONTENT CANVAS ================= -->
  <g transform="translate(292, 80)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="876" height="700" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-sm)"/>

    <!-- Form Header & Steps Bar -->
    <g transform="translate(32, 24)">
      <text x="0" y="22" fill="#0f172a" font-size="18" font-weight="800">In-Admin Manuscript Submission Studio</text>
      <text x="0" y="42" fill="#64748b" font-size="12">Upload your draft alongside the journal template for automated Gemini AI formatting review.</text>

      <!-- Step Indicators -->
      <g transform="translate(560, 10)">
        <rect x="0" y="0" width="70" height="24" rx="4" fill="#e2e8f0"/>
        <text x="12" y="16" fill="#475569" font-size="11" font-weight="600">1. Details</text>
        <text x="76" y="16" fill="#94a3b8" font-size="11">→</text>
        
        <rect x="90" y="0" width="76" height="24" rx="4" fill="#4f46e5"/>
        <text x="100" y="16" fill="#ffffff" font-size="11" font-weight="700">2. Upload</text>
        <text x="172" y="16" fill="#94a3b8" font-size="11">→</text>

        <rect x="186" y="0" width="60" height="24" rx="4" fill="#f1f5f9"/>
        <text x="196" y="16" fill="#94a3b8" font-size="11" font-weight="600">3. Report</text>
      </g>
    </g>

    <line x1="0" y1="80" x2="876" y2="80" stroke="#f1f5f9" stroke-width="1"/>

    <!-- STEP 1 METADATA SUMMARY -->
    <g transform="translate(32, 100)">
      <rect x="0" y="0" width="812" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-size="11" font-weight="600">PAPER TITLE:</text>
      <text x="100" y="24" fill="#0f172a" font-size="12" font-weight="700">A Comparative Study of Efficient File Ingestion in Academic Web Portals</text>
      
      <text x="16" y="46" fill="#64748b" font-size="11" font-weight="600">KEYWORDS:</text>
      <text x="100" y="46" fill="#475569" font-size="11">Academic Publishing, Cloud Storage, Document Processing, Multimodal Vision</text>
    </g>

    <!-- STEP 2: SIDE-BY-SIDE DUAL DROPZONES -->
    <g transform="translate(32, 184)">
      <!-- Left Dropzone: Journal Template -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="394" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        
        <text x="20" y="28" fill="#0f172a" font-size="13" font-weight="700">1. Journal Reference Template (PDF)</text>
        <rect x="310" y="14" width="64" height="18" rx="9" fill="#f1f5f9"/>
        <text x="322" y="27" fill="#64748b" font-size="10" font-weight="600">Optional</text>
        
        <text x="20" y="50" fill="#64748b" font-size="11">Target margins, fonts, and column geometry benchmark.</text>

        <!-- Drop Box -->
        <rect x="20" y="68" width="354" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
        <text x="197" y="125" fill="#3b82f6" font-size="28" text-anchor="middle">📄</text>
        <text x="197" y="152" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">IEEE-Transactions.pdf</text>
        <text x="197" y="170" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">✓ Attached (240.5 KB)</text>
        <text x="197" y="195" fill="#64748b" font-size="10" text-anchor="middle">Drag &amp; drop to replace</text>
      </g>

      <!-- Right Dropzone: Manuscript Draft -->
      <g transform="translate(418, 0)">
        <rect x="0" y="0" width="394" height="240" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
        
        <text x="20" y="28" fill="#0f172a" font-size="13" font-weight="700">2. Manuscript Draft (PDF)</text>
        <rect x="310" y="14" width="64" height="18" rx="9" fill="#e0e7ff"/>
        <text x="322" y="27" fill="#4338ca" font-size="10" font-weight="700">Required</text>
        
        <text x="20" y="50" fill="#64748b" font-size="11">Your author paper to be screened for format and leaks.</text>

        <!-- Drop Box -->
        <rect x="20" y="68" width="354" height="150" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 5"/>
        <text x="197" y="125" fill="#4f46e5" font-size="28" text-anchor="middle">📑</text>
        <text x="197" y="152" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">manuscript_draft_v1.pdf</text>
        <text x="197" y="170" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">✓ Ready to Upload (1.4 MB)</text>
        <text x="197" y="195" fill="#64748b" font-size="10" text-anchor="middle">Drag &amp; drop to replace</text>
      </g>
    </g>

    <!-- Upload Progress & Action Button -->
    <g transform="translate(32, 444)">
      <rect x="0" y="0" width="812" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="16" y="25" fill="#1e40af" font-size="11" font-weight="600">
        ℹ️ Files will stream directly to Box Cloud Storage and trigger Google Gemini AI pre-check.
      </text>

      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="130" height="40" rx="8" fill="#f1f5f9"/>
        <text x="22" y="25" fill="#475569" font-size="12" font-weight="600">← Back to Details</text>

        <rect x="532" y="0" width="280" height="40" rx="8" fill="#4f46e5"/>
        <text x="562" y="25" fill="#ffffff" font-size="13" font-weight="700">Upload to Box &amp; Check Format ➔</text>
      </g>
    </g>

    <!-- RECENT SUBMISSIONS TABLE PREVIEW BELOW -->
    <g transform="translate(32, 570)">
      <line x1="0" y1="0" x2="812" y2="0" stroke="#e2e8f0" stroke-width="1"/>
      <text x="0" y="26" fill="#0f172a" font-size="13" font-weight="700">Recent Format Screenings</text>
      
      <!-- Mini table row -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="812" height="44" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="16" y="26" fill="#0f172a" font-size="11" font-weight="600">Zero-Copy Ingestion in Distributed Microservices</text>
        <text x="430" y="26" fill="#64748b" font-size="11">IEEE Template</text>
        
        <rect x="560" y="12" width="90" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="572" y="26" fill="#059669" font-size="10" font-weight="700">Score: 95/100</text>
        
        <rect x="664" y="12" width="70" height="20" rx="10" fill="#f1f5f9"/>
        <text x="674" y="26" fill="#475569" font-size="10" font-weight="600">Accepted</text>

        <text x="750" y="26" fill="#4f46e5" font-size="11" font-weight="600">Report →</text>
      </g>
    </g>
  </g>
</svg>

