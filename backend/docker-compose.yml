services:
  postgres:
    image: postgres:16-alpine
    container_name: jms-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jms_password}
      POSTGRES_DB: ${POSTGRES_DB:-jms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only the *.up.sql files (in order) + dev seed. Mounting the whole migrations
      # folder also ran the *.down.sql files and aborted the init.
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
      - ./db/migrations/000002_add_template_support.up.sql:/docker-entrypoint-initdb.d/002_add_template_support.sql:ro
      - ./db/migrations/000003_audit_summary_engine.up.sql:/docker-entrypoint-initdb.d/003_audit_summary_engine.sql:ro
      - ./db/seeds/001_seed_dev_data.sql:/docker-entrypoint-initdb.d/004_seed_dev_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jms_user} -d ${POSTGRES_DB:-jms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jms-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: jms-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: jms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_NAME:-jms-manuscripts};
      /usr/bin/mc anonymous set download local/${S3_BUCKET_NAME:-jms-manuscripts}/audits;
      exit 0;
      "

  # PyMuPDF audit engine (HTTP). The gateway calls it at AUDIT_ENGINE_URL.
  # Start with: docker compose up -d ai-worker   (or run locally: make run-worker)
  ai-worker:
    build: ./ai-worker
    container_name: jms-ai-worker
    restart: unless-stopped
    environment:
      AUDIT_ENGINE_HOST: 0.0.0.0
      AUDIT_ENGINE_PORT: 8090
      AUDIT_ENGINE_TOKEN: ${AUDIT_ENGINE_TOKEN:-}
      AUDIT_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-35}
    ports:
      - "${AUDIT_ENGINE_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:

