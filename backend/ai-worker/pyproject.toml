[project]
name = "jms-ai-worker"
version = "0.1.0"
description = "JMS Pre-Submission AI Layout, Anonymization & Citation Integrity Engine"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23.0",
    "spacy>=3.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

