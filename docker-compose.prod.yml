# Format Kilat (⚡) - Production Stack (Docker Hub: ageng133)
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: ageng133/format-kilat-db:latest
    container_name: format_kilat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-jms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jms_secret_pass}
      POSTGRES_DB: ${DB_NAME:-jms_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jms} -d ${DB_NAME:-jms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: format_kilat_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ai-worker:
    image: ageng133/format-kilat-ai-worker:latest
    container_name: format_kilat_ai_worker
    restart: unless-stopped
    environment:
      AUDIT_ENGINE_HOST: 0.0.0.0
      AUDIT_ENGINE_PORT: "8090"
      AUDIT_ENGINE_TOKEN: ${AUDIT_ENGINE_TOKEN:-}
      AUDIT_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-35}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  gateway:
    image: ageng133/format-kilat-gateway:latest
    container_name: format_kilat_gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-35}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${DB_USER:-jms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jms_secret_pass}
      POSTGRES_DB: ${DB_NAME:-jms_db}
      POSTGRES_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENABLE_REDIS: ${ENABLE_REDIS:-false}
      JWT_SECRET: ${JWT_SECRET:-format-kilat-production-jwt-secret-key-2026}
      AUTH_DEMO_LOGIN: ${AUTH_DEMO_LOGIN:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      EDITOR_EMAILS: ${EDITOR_EMAILS:-}
      STORAGE_DRIVER: box
      BOX_LOCAL_FALLBACK_DIR: /app/storage/box
      BOX_DEVELOPER_TOKEN: ${BOX_DEVELOPER_TOKEN:-}
      BOX_FOLDER_ID: ${BOX_FOLDER_ID:-0}
      AUDIT_ENGINE_URL: http://ai-worker:8090
      AUDIT_ENGINE_TOKEN: ${AUDIT_ENGINE_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RESHAPE_ENABLED: "false"
    volumes:
      - box_storage:/app/storage/box

  frontend:
    image: ageng133/format-kilat-frontend:latest
    container_name: format_kilat_frontend
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}

volumes:
  postgres_data:
  redis_data:
  box_storage:

